<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Music Player</title>
  <link rel="stylesheet" href="style.css">
  <!-- Font Awesome untuk ikon -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
  <div class="container">
    <h1 class="title">Daftar Lagu</h1>
    
    <!-- Area Pencarian Real-Time -->
    <div style="display: flex; gap: 10px; margin-bottom: 20px; padding: 0 15px;">
      <input type="text" id="searchInput" placeholder="Cari lagu / paste link YT..." style="flex: 1; padding: 12px; border-radius: 12px; border: none; background: #2a1b4e; color: #fff; outline: none; font-family: inherit;">
      <button id="searchBtn" style="padding: 12px 20px; border-radius: 12px; border: none; background: #6b21a8; color: #fff; cursor: pointer; font-weight: bold; transition: 0.3s;">Cari</button>
    </div>

    <div class="song-list" id="songList">
      <!-- Daftar lagu manual akan dirender di sini oleh JS -->
    </div>
  </div>

  <!-- Player UI (Disembunyikan secara default, muncul saat lagu diputar) -->
  <div class="player-container" id="playerContainer" style="display: none;">
    <button id="backBtn" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Kembali</button>
    
    <div class="cover-wrapper">
      <img src="" alt="Cover" class="song-cover" id="songCover">
    </div>
    
    <div class="song-info">
      <h2 id="songTitle">Judul Lagu</h2>
      <p id="songArtist">Artis</p>
    </div>

    <!-- Audio Element -->
    <audio id="audioPlayer"></audio>

    <div class="progress-container" id="progressContainer">
      <div class="progress" id="progress"></div>
    </div>
    
    <div class="time-info">
      <span id="currentTime">0:00</span>
      <span id="duration">0:00</span>
    </div>

    <div class="controls">
      <button id="prevBtn"><i class="fa-solid fa-backward-step"></i></button>
      <button id="playBtn" class="play-pause"><i class="fa-solid fa-play"></i></button>
      <button id="nextBtn"><i class="fa-solid fa-forward-step"></i></button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
